name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
          cache: pip

      - name: Install uv
        run: python -m pip install --disable-pip-version-check --no-input uv==0.12.5

      - name: Install locked development dependencies
        run: uv sync --group dev --frozen

      - name: Run tests
        run: uv run --group dev python -m unittest discover -s tests

      - name: Validate schemas
        run: uv run --group dev python -m unittest tests.test_schema

      - name: Run Ruff
        run: uv run --group dev ruff check .

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Audit Python dependencies
        run: |
          uv export --group dev --frozen --no-emit-project --output-file /tmp/edlb-audit-requirements.txt
          uv run --with pip-audit==2.10.1 pip-audit --strict --require-hashes --requirement /tmp/edlb-audit-requirements.txt

      - name: Scan repository history for secrets
        run: |
          docker run --rm --volume "$PWD:/repo:ro" ghcr.io/trufflesecurity/trufflehog@sha256:ff4c95e9df7d645daf2140e3ca1039031c63106268d5fbb25feb43ceca1bcc33 git file:///repo --results=verified,unknown --fail --no-update
